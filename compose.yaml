# Local run: `docker compose up --build`, then POST to http://localhost:8080/payouts.
# Credentials here are throwaway local defaults, not secrets.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payout
      POSTGRES_USER: payout
      POSTGRES_PASSWORD: payout
    ports:
      # Change the host side if 5432 is taken: PAYOUT_DB_PORT=55432 docker compose up
      - "${PAYOUT_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payout -d payout"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL for containers on this network, EXTERNAL for ./gradlew bootRun on the host.
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      PAYOUT_DB_URL: jdbc:postgresql://postgres:5432/payout
      PAYOUT_DB_USER: payout
      PAYOUT_DB_PASSWORD: payout
      PAYOUT_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # Fake bank publishes a SETTLED result for every executed transfer, so payouts reach SETTLED.
      PAYOUT_FAKEBANK_EMITRESULTS: "true"
    ports:
      - "${PAYOUT_APP_PORT:-8080}:8080"
